[project]
name = "pbo-workforce-data-service"
version = "0.1.0"
description = "Parliamentary Budget Officer (PBO) Workforce Data Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1.5",
]

[project.scripts]
pbo-import = "pbo_workforce.ingest.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-openpyxl",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbo_workforce"]

[tool.pyright]
include = ["src", "tests", "migrations"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Lets editors (not only `uv run pyright`) resolve the project virtualenv.
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ANN", "SIM", "RUF", "N", "PT"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers as `tests.factories`.
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["slow: imports the full data/data.xlsx (about 20 s); runs in CI"]
